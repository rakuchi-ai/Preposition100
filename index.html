<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>前置詞問題強化100問</title>
    
    <!-- Google FontsからUD系フォント（BIZ UDPGothic）を読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    
    <!-- 追加：ポータルへ戻るリンク用およびUDフォント適用のCSS -->
    <style>
        :root {
            --base-font: "UD Digi Kyokasho N-R", "UD Digital Kyokasho NK-R", "BIZ UDPGothic", "メイリオ", Meiryo, sans-serif;
        }

        /* ページ全体および文字を扱う要素にUDフォントを確実に適用 */
        body, button, input, select, textarea, h1, h2, h3, h4, h5, h6 {
            font-family: var(--base-font) !important;
        }

        .back-portal-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #64748b;
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            text-decoration: none;
            transition: background-color 0.2s, color 0.2s;
        }
        .back-portal-link:hover {
            background-color: #e2e8f0;
            color: #1e293b;
        }
        /* ヘッダー内でのレイアウト調整用 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="title">前置詞問題強化100問</h1>
            
            <!-- 追加：ポータルへ戻るリンク -->
            <a href="https://rakuchi-ai.github.io/ENGLISH-TOP/" class="back-portal-link">
                &larr; ポータルに戻る
            </a>
        </header>

        <!-- Menu Screen -->
        <main id="menu-screen" class="screen">
            <p class="description">出題範囲を選択して演習を開始してください。</p>
            
            <div class="range-grid">
                <button class="btn btn-outline range-btn" data-mode="range" data-start="1" data-end="10">No.1 - 10</button>
                <button class="btn btn-outline range-btn" data-mode="range" data-start="11" data-end="20">No.11 - 20</button>
                <button class="btn btn-outline range-btn" data-mode="range" data-start="21" data-end="30">No.21 - 30</button>
                <button class="btn btn-outline range-btn" data-mode="range" data-start="31" data-end="40">No.31 - 40</button>
                <button class="btn btn-outline range-btn" data-mode="range" data-start="41" data-end="50">No.41 - 50</button>
                <button class="btn btn-outline range-btn" data-mode="range" data-start="51" data-end="60">No.51 - 60</button>
                <button class="btn btn-outline range-btn" data-mode="range" data-start="61" data-end="70">No.61 - 70</button>
                <button class="btn btn-outline range-btn" data-mode="range" data-start="71" data-end="80">No.71 - 80</button>
                <button class="btn btn-outline range-btn" data-mode="range" data-start="81" data-end="90">No.81 - 90</button>
                <button class="btn btn-outline range-btn" data-mode="range" data-start="91" data-end="100">No.91 - 100</button>
            </div>

            <button class="btn btn-primary btn-large range-btn" data-mode="all">全100問を一括挑戦</button>

            <div class="stock-box">
                <h3>⭐ 間違えた問題・ストック</h3>
                <p>現在ストック: <span id="stock-count">0</span> 問</p>
                <button id="stock-mode-btn" class="btn btn-warning" disabled>ストック問題だけを復習</button>
            </div>
        </main>

        <!-- Quiz Screen -->
        <main id="quiz-screen" class="screen hidden">
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <div class="quiz-status">
                <span id="question-counter" class="status-tag"></span>
                <button id="interrupt-btn" class="btn btn-small btn-secondary">演習を中断</button>
            </div>

            <div class="card question-card">
                <span id="q-id-tag" class="badge"></span>
                <p id="question-text" class="question-text"></p>
            </div>

            <div id="choices-container" class="choices-container"></div>

            <div id="explanation-box" class="card explanation-box hidden">
                <div id="result-badge" class="result-badge"></div>
                <div class="correct-answer">
                    <strong>正解:</strong> <span id="correct-answer-text"></span>
                </div>
                <div class="explanation-content">
                    <strong>解説:</strong>
                    <p id="explanation-text"></p>
                </div>
                <div id="action-buttons-container" class="action-buttons"></div>
            </div>
        </main>

        <!-- Result Screen -->
        <main id="result-screen" class="screen hidden">
            <div class="card result-card">
                <h2>🎉 お疲れ様でした！</h2>
                <div class="score-display">
                    <p class="score-label">正解数</p>
                    <p id="score-text" class="score-val"></p>
                </div>
                <p id="result-detail" class="result-detail"></p>
                <button id="result-menu-btn" class="btn btn-primary btn-large">メニューへ戻る</button>
            </div>
        </main>
    </div>

    <script src="questions.js"></script>
    <script src="app.js"></script>
</body>
</html>
